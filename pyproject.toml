[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-bnn-intake"
version = "0.14.15"
description = "Optional versioned semantic intake on the existing Hermes BNN memory store"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bnn_intake = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
